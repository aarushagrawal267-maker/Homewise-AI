[theme]
base = "dark"
primaryColor = "#4FA89B"
backgroundColor = "#141415"
secondaryBackgroundColor = "#232325"
textColor = "#EDEDED"
font = "sans serif"

[server]
enableStaticServing = true
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
